name: Publish to GitHub Pages

# Builds the static bundle and publishes it, which is how the URL in the
# observation comes to exist. This is the same `npm run build` the acceptance run
# builds with, so what Pages serves is what the oracle judged.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight publish rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build the static bundle
        env:
          # A project page is served from /<repo>/, so the bundle's asset URLs
          # need that prefix.
          PAGES_BASE: /${{ github.event.repository.name }}/
          # Public configuration only. The service-role key is never published
          # and is not available to this workflow.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
