# Pins the local Supabase stack the acceptance run brings up with the CLI.
# Tests run against this stack in Docker, never against a hosted project.

project_id = "meal-insulin-log"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173", "http://localhost:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = false
# Email and password only, and no mail round trip: the acceptance run seeds its
# two accounts through the service role with addresses already confirmed.
enable_confirmations = false
secure_password_change = false
